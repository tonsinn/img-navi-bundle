name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Check PHP syntax
        run: find src contao -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Check XLIFF files are well-formed
        run: |
          php -r '$e=0; foreach (glob("contao/languages/*/*.xlf") as $f) { $d = new DOMDocument(); if (!@$d->load($f)) { fwrite(STDERR, "Invalid XML: $f\n"); $e=1; } } exit($e);'
          echo "XLIFF OK"
